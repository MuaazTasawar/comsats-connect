<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin console - COMSATS Connect</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">

  <header class="admin-top">
    <div class="admin-brand">
      <h1>Admin console</h1>
      <span id="admin-me"></span>
    </div>
    <div class="admin-links">
      <a class="btn btn-quiet btn-small" href="/chat.html">Back to chat</a>
      <button type="button" class="btn btn-quiet btn-small" id="signout-btn">Sign out</button>
    </div>
  </header>

  <main class="admin-main">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" class="tab active" id="tab-users" aria-selected="true" aria-controls="view-users">Users</button>
      <button type="button" role="tab" class="tab" id="tab-groups" aria-selected="false" aria-controls="view-groups">Groups</button>
    </div>

    <section id="view-users" role="tabpanel" aria-labelledby="tab-users">
      <div class="toolbar">
        <input class="input" id="user-search" type="search" placeholder="Search by name or login ID" aria-label="Search users" autocomplete="off">
        <select class="input" id="user-role" aria-label="Filter by role">
          <option value="">All roles</option>
          <option value="student">Students</option>
          <option value="faculty">Faculty</option>
          <option value="admin">Admins</option>
        </select>
        <select class="input" id="user-dept" aria-label="Filter by department">
          <option value="">All departments</option>
        </select>
        <label class="check"><input type="checkbox" id="user-inactive" checked> Show deactivated</label>
        <button type="button" class="btn toolbar-end" id="add-user-btn">Add user</button>
      </div>
      <p class="count" id="user-count"></p>
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th scope="col">User</th>
              <th scope="col">Role</th>
              <th scope="col">Department</th>
              <th scope="col">Status</th>
              <th scope="col">Last sign-in</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>
          <tbody id="user-body"></tbody>
        </table>
      </div>
    </section>

    <section id="view-groups" role="tabpanel" aria-labelledby="tab-groups" hidden>
      <div class="toolbar">
        <input class="input" id="group-search" type="search" placeholder="Search groups" aria-label="Search groups" autocomplete="off">
        <select class="input" id="group-type" aria-label="Filter by type">
          <option value="">All types</option>
        </select>
        <select class="input" id="group-policy" aria-label="Filter by posting policy">
          <option value="">All posting policies</option>
        </select>
        <button type="button" class="btn toolbar-end" id="add-group-btn">Create group</button>
      </div>
      <p class="count" id="group-count"></p>
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th scope="col">Group</th>
              <th scope="col">Type</th>
              <th scope="col">Who can post</th>
              <th scope="col">Members</th>
              <th scope="col">Created</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>
          <tbody id="group-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
